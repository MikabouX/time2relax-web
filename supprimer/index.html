<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supprimer mon compte · Time2Relax</title>
  <link rel="icon" type="image/png" href="../icon-192.png">
  <style>
    :root { --bg:#F4F6F5; --card:#fff; --ink:#1d2421; --muted:#5d6763; --line:#d8dedb; --acc:#2E7D5B; --err:#B3261E; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121614; --card:#1c211f; --ink:#e6ebe8; --muted:#9aa49f; --line:#333b37; --acc:#7fd1a8; --err:#ffb4ab; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:1.5rem; margin:0 0 6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:transparent; color:inherit; }
    button { margin-top:16px; padding:10px 18px; border:0; border-radius:999px; background:var(--err); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .muted { color:var(--muted); font-size:.92rem; }
    #msg { margin-top:12px; font-weight:600; }
    #msg.ok { color:var(--acc); } #msg.err { color:var(--err); }
    nav { font-size:.9rem; margin-bottom:12px; } nav a { color:var(--acc); margin-right:10px; }
  </style>
</head>
<body>
<main>
  <nav><a href="?l=fr">FR</a><a href="?l=nl">NL</a><a href="?l=en">EN</a><a href="?l=de">DE</a></nav>
  <h1 id="t-title"></h1>
  <p id="t-intro" class="muted"></p>
  <div class="card">
    <form id="f">
      <label for="name" id="t-name"></label>
      <input id="name" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" required>
      <label for="code" id="t-code"></label>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="ABCD-EFGH-JKLM-NPQR-STUV">
      <p id="t-where" class="muted"></p>
      <button id="go" type="submit"></button>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="card">
    <p id="t-what"></p>
    <p id="t-mail" class="muted"></p>
  </div>
</main>
<script>
'use strict';
const URL_ = 'https://gxftbzbvbveocwpdavtt.supabase.co';
const KEY = 'sb_publishable_9fKWGXevueh6hHJpGQvmhg_EFOd_-dR';
const MAIL = 'mb.technogeek@atomicmail.io';
const T = {
  fr: { title: 'Supprimer mon compte Time2Relax', intro: 'Efface tout ce qui est enregistré en ligne sous ton nom d’utilisateur. Tu peux aussi le faire dans l’appli : Réglages → Supprimer l’utilisateur.',
    name: 'Nom d’utilisateur', code: 'Code de récupération', where: 'Le code se trouve dans l’appli : Réglages → Code de récupération.',
    go: 'Supprimer définitivement', confirm: 'Supprimer définitivement « {n} » et tout ce qui est en ligne sous ce nom ?',
    done: 'C’est fait : tout ce qui était en ligne sous « {n} » est effacé.', unknown: 'Ce nom n’existe pas.', wrong: 'Code incorrect.',
    open: 'Ce nom n’est pas encore protégé par un code : supprime-le depuis l’appli (Réglages → Supprimer l’utilisateur) ou écris-nous.',
    err: 'Impossible pour l’instant. Réessaie plus tard ou écris-nous.',
    what: 'Ce qui est effacé tout de suite : les pauses en ligne (date, heure, type, durée), les réglages enregistrés, le chrono en cours et le nom lui-même. Ce qui reste sur ton téléphone n’est pas touché (désinstalle l’appli pour l’effacer). Un partage d’horaire avec un proche s’arrête depuis l’appli, ou s’efface seul après 60 jours sans mise à jour.',
    mail: 'Code perdu ou question ? Écris à {m} avec ton nom d’utilisateur : la suppression est faite sous 30 jours.' },
  nl: { title: 'Mijn Time2Relax-account verwijderen', intro: 'Wist alles wat online onder je gebruikersnaam staat. Kan ook in de app: Instellingen → Gebruiker verwijderen.',
    name: 'Gebruikersnaam', code: 'Herstelcode', where: 'De code staat in de app: Instellingen → Herstelcode.',
    go: 'Definitief verwijderen', confirm: '„{n}” en alles wat online onder die naam staat definitief verwijderen?',
    done: 'Klaar: alles wat online onder „{n}” stond, is gewist.', unknown: 'Deze naam bestaat niet.', wrong: 'Onjuiste code.',
    open: 'Deze naam is nog niet beveiligd met een code: verwijder hem in de app (Instellingen → Gebruiker verwijderen) of schrijf ons.',
    err: 'Nu niet mogelijk. Probeer later opnieuw of schrijf ons.',
    what: 'Meteen gewist: online pauzes (datum, uur, type, duur), bewaarde instellingen, de lopende stopwatch en de naam zelf. Wat op je telefoon staat, blijft (verwijder de app om het te wissen). Een gedeeld rooster stop je in de app, of het verdwijnt vanzelf na 60 dagen zonder update.',
    mail: 'Code kwijt of een vraag? Schrijf naar {m} met je gebruikersnaam: de verwijdering gebeurt binnen 30 dagen.' },
  en: { title: 'Delete my Time2Relax account', intro: 'Erases everything stored online under your username. You can also do it in the app: Settings → Delete user.',
    name: 'Username', code: 'Recovery code', where: 'The code is in the app: Settings → Recovery code.',
    go: 'Delete permanently', confirm: 'Permanently delete “{n}” and everything online under this name?',
    done: 'Done: everything online under “{n}” has been erased.', unknown: 'This name doesn’t exist.', wrong: 'Wrong code.',
    open: 'This name isn’t protected by a code yet: delete it from the app (Settings → Delete user) or write to us.',
    err: 'Not possible right now. Try again later or write to us.',
    what: 'Erased immediately: online breaks (date, time, type, duration), saved settings, the running stopwatch and the name itself. What is on your phone stays (uninstall the app to erase it). A schedule shared with someone is stopped from the app, or erases itself after 60 days without an update.',
    mail: 'Lost your code or have a question? Write to {m} with your username: deletion is done within 30 days.' },
  de: { title: 'Mein Time2Relax-Konto löschen', intro: 'Löscht alles, was online unter deinem Benutzernamen gespeichert ist. Geht auch in der App: Einstellungen → Benutzer löschen.',
    name: 'Benutzername', code: 'Wiederherstellungscode', where: 'Der Code steht in der App: Einstellungen → Wiederherstellungscode.',
    go: 'Endgültig löschen', confirm: '„{n}“ und alles online unter diesem Namen endgültig löschen?',
    done: 'Erledigt: alles online unter „{n}“ ist gelöscht.', unknown: 'Diesen Namen gibt es nicht.', wrong: 'Falscher Code.',
    open: 'Dieser Name ist noch nicht mit einem Code geschützt: lösche ihn in der App (Einstellungen → Benutzer löschen) oder schreib uns.',
    err: 'Gerade nicht möglich. Versuch es später oder schreib uns.',
    what: 'Sofort gelöscht: Pausen online (Datum, Uhrzeit, Art, Dauer), gespeicherte Einstellungen, die laufende Stoppuhr und der Name selbst. Was auf deinem Telefon ist, bleibt (deinstalliere die App, um es zu löschen). Ein geteilter Plan wird in der App beendet oder löscht sich nach 60 Tagen ohne Aktualisierung von selbst.',
    mail: 'Code verloren oder eine Frage? Schreib an {m} mit deinem Benutzernamen: Die Löschung erfolgt innerhalb von 30 Tagen.' },
};
const q = new URLSearchParams(location.search).get('l');
const nav = (navigator.language || 'fr').slice(0, 2);
const L = T[q] ? q : (T[nav] ? nav : 'fr');
const tx = (k, v = {}) => T[L][k].replace('{n}', v.n || '').replace('{m}', MAIL);
document.documentElement.lang = L;
for (const k of ['title', 'intro', 'name', 'code', 'where', 'go', 'what', 'mail']) document.getElementById(k === 'go' ? 'go' : 't-' + k).textContent = tx(k);
document.title = tx('title');
const normKey = (v) => { let s = String(v || '').trim(); const i = s.lastIndexOf(':'); if (i >= 0) s = s.slice(i + 1); return s.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
async function rpc(fn, args) {
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const txt = await r.text();
  if (!r.ok) throw new Error(txt || r.status);
  return txt ? JSON.parse(txt) : null;
}
const msg = document.getElementById('msg');
const say = (k, ok, v) => { msg.textContent = tx(k, v); msg.className = ok ? 'ok' : 'err'; };
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const n = document.getElementById('name').value.trim().toLowerCase().replace(/\s+/g, ' ');
  const k = normKey(document.getElementById('code').value);
  if (n.length < 2) return;
  const btn = document.getElementById('go');
  btn.disabled = true;
  try {
    const st = await rpc('t2r_name_check', { p_username: n, p_key: k || null });
    if (st === 'unknown') return say('unknown');
    if (st === 'open') return say('open');
    if (st !== 'ok') return say('wrong');
    if (!confirm(tx('confirm', { n }))) return;
    await rpc('t2r_user_delete', { p_username: n, p_key: k });
    say('done', true, { n });
  } catch (_) {
    say('err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
